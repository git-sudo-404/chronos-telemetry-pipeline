x-mock-generator: &mock-generator
  build:
    context: ../..
    dockerfile: deployments/docker/Dockerfile.mock-generator
  image: chronos-mock-generator:local
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  mock-generator-1:
    <<: *mock-generator
    environment:
      GATEWAY_URL: "http://host.docker.internal:8080/api/v1/telemetry/ingest"
      VEHICLE_START_ID: "1"
      VEHICLE_END_ID: "1000"

  mock-generator-2:
    <<: *mock-generator
    environment:
      GATEWAY_URL: "http://host.docker.internal:8080/api/v1/telemetry/ingest"
      VEHICLE_START_ID: "1001"
      VEHICLE_END_ID: "2000"

  mock-generator-3:
    <<: *mock-generator
    environment:
      GATEWAY_URL: "http://host.docker.internal:8080/api/v1/telemetry/ingest"
      VEHICLE_START_ID: "2001"
      VEHICLE_END_ID: "3000"
