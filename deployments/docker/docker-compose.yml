version: '3.8'

services:
  # 🚗 Simulator Node 01: Manages Vehicles 1 to 2,000
  mock-generator-node1:
    image: golang:1.21-alpine
    container_name: chronos-mock-generator-01
    volumes:
      - ../../:/workspace
    working_dir: /workspace/services/mock-generator
    command: go run main.go
    environment:
      - GATEWAY_URL=http://localhost:8080/api/v1/telemetry/ingest
      - VEHICLE_START_ID=1
      - VEHICLE_END_ID=2000
      - GPS_FREQUENCY_SEC=1
      - ENGINE_FREQUENCY_SEC=2
      - FUEL_FREQUENCY_SEC=5
      - BATTERY_FREQUENCY_SEC=5
      - DIAGNOSTIC_FREQUENCY_SEC=10
      - DEADZONE_PROBABILITY_PCT=10
      - DEADZONE_DURATION_SEC=15
    network_mode: "host" # Allows local containers to easily target an external/local port 8080 gateway instance

  # 🚗 Simulator Node 02: Manages Vehicles 2,001 to 4,000
