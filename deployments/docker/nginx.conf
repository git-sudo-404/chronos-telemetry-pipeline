events {
    worker_connections 1024;
}

http {
    # ⏱️ Define a Rate Limiting Zone based on client IP (100 requests/sec limit per vehicle IP)
    limit_req_zone $binary_remote_addr zone=telemetry_limit:10m rate=100r/s;
    limit_req_status 429;

    upstream go_gateway {
        server edge-gateway:8080;
    }

    server {
        listen 80; # In production, this shifts to port 443 with mTLS configs

        location /api/v1/telemetry/ingest {
            # 🛑 1. Reject requests that exceed our maximum expected binary Protobuf size (e.g., 2KB max)
            client_max_body_size 2k;

            # 🛑 2. Enforce strict rate-limiting with a burst allowance of 50 packets
            limit_req zone=telemetry_limit burst=50 nodelay;

            # Forward clean traffic to the Go Application
            proxy_pass http://go_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
